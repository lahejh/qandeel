name: qandeel
description: "Qandeel - free Quran & Azkar app for the whole family"
# Never published to pub.dev; this is an app, not a package.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Keep dependencies minimal (see CLAUDE.md). Every package must be approved
# by the owner and must not send any data anywhere.
dependencies:
  flutter:
    sdk: flutter
  # Part of the Flutter SDK: Arabic/English UI text, RTL layout, dates.
  flutter_localizations:
    sdk: flutter
  # Dart team's localization library, required by flutter_localizations.
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Artwork (no people, animals or text). See assets/images/README.md.
  assets:
    - assets/images/home_day.jpg
    - assets/images/home_night.jpg
    # Verified Quran text + metadata: exact copies of content/quran/ (never
    # edit; a test checks the copies are identical). See content/quran/SOURCE.md.
    - assets/quran/quran-uthmani.txt
    - assets/quran/quran-data.xml

  # Bundled fonts (SIL OFL 1.1) — never downloaded at runtime.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700
