name: CI

# Runs tests and builds an Android APK on every push and pull request.
# Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: qandeel-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
